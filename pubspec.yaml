
name: my_money
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Local database and storage
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.0.7
  image_picker: ^1.2.0

  # PDF reports and sharing
  pdf: ^3.13.1
  printing: ^5.15.1

  # Google Drive backup
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # Firebase Google Sign-In authentication
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/mymoney_logo.png
