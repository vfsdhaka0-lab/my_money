
name: Setup MyMoney Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create database folders
        run: |
          mkdir -p lib/core/database/tables

      - name: Create Accounts table
        run: |
          cat > lib/core/database/tables/accounts.dart <<'EOF'
          import 'package:drift/drift.dart';

          class Accounts extends Table {
            IntColumn get id => integer().autoIncrement()();

            TextColumn get name => text()();

            IntColumn get openingBalancePaisa =>
                integer().withDefault(const Constant(0))();

            TextColumn get currency =>
                text().withDefault(const Constant('BDT'))();

            DateTimeColumn get createdAt =>
                dateTime().withDefault(currentDateAndTime)();

            BoolColumn get isActive =>
                boolean().withDefault(const Constant(true))();
          }
          EOF

      - name: Create Categories table
        run: |
          cat > lib/core/database/tables/categories.dart <<'EOF'
          import 'package:drift/drift.dart';

          class Categories extends Table {
            IntColumn get id => integer().autoIncrement()();

            TextColumn get name => text()();

            TextColumn get type => text()();

            TextColumn get icon =>
                text().withDefault(const Constant('category'))();

            BoolColumn get isActive =>
                boolean().withDefault(const Constant(true))();
          }
          EOF

      - name: Create Transactions table
        run: |
          cat > lib/core/database/tables/transactions.dart <<'EOF'
          import 'package:drift/drift.dart';

          class Transactions extends Table {
            IntColumn get id => integer().autoIncrement()();

            IntColumn get accountId => integer()();

            IntColumn get categoryId => integer().nullable()();

            TextColumn get title => text()();

            IntColumn get amountPaisa => integer()();

            TextColumn get type => text()();

            TextColumn get note => text().nullable()();

            DateTimeColumn get date => dateTime()();

            DateTimeColumn get createdAt =>
                dateTime().withDefault(currentDateAndTime)();
          }
          EOF

      - name: Create AppDatabase
        run: |
          cat > lib/core/database/app_database.dart <<'EOF'
          import 'dart:io';

          import 'package:drift/drift.dart';
          import 'package:drift/native.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';

          import 'tables/accounts.dart';
          import 'tables/categories.dart';
          import 'tables/transactions.dart';

          part 'app_database.g.dart';

          @DriftDatabase(
            tables: [
              Accounts,
              Categories,
              Transactions,
            ],
          )
          class AppDatabase extends _$AppDatabase {
            AppDatabase() : super(_openConnection());

            @override
            int get schemaVersion => 1;
          }

          LazyDatabase _openConnection() {
            return LazyDatabase(() async {
              final directory =
                  await getApplicationDocumentsDirectory();

              final file = File(
                p.join(directory.path, 'my_money.sqlite'),
              );

              return NativeDatabase.createInBackground(file);
            });
          }
          EOF

      - name: Generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze

      - name: Commit database files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m "Set up Drift database"
            git push
          fi
