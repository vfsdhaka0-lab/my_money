
name: Create MyMoney Accounts Screen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add account database methods
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/core/database/app_database.dart")
          content = path.read_text()

          methods = """
            Stream<List<Account>> watchAccounts() {
              return select(accounts).watch();
            }

            Future<int> addAccount({
              required String name,
              required int openingBalancePaisa,
            }) {
              return into(accounts).insert(
                AccountsCompanion.insert(
                  name: name,
                  openingBalancePaisa: Value(openingBalancePaisa),
                ),
              );
            }
          """

          if "watchAccounts()" not in content:
              content = content.replace(
                  "int get schemaVersion => 1;",
                  "int get schemaVersion => 1;\\n" + methods
              )

          path.write_text(content)
          PY

      - name: Create Accounts screen
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'core/database/app_database.dart';

          final database = AppDatabase();

          void main() {
            runApp(const MyMoneyApp());
          }

          class MyMoneyApp extends StatelessWidget {
            const MyMoneyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MyMoney',
                theme: ThemeData(
                  colorSchemeSeed: Colors.green,
                  useMaterial3: true,
                ),
                home: const AccountsPage(),
              );
            }
          }

          class AccountsPage extends StatelessWidget {
            const AccountsPage({super.key});

            String formatMoney(int paisa) {
              final taka = paisa ~/ 100;
              final remainder = (paisa % 100).toString().padLeft(2, '0');
              return '৳$taka.$remainder';
            }

            Future<void> showAddAccountDialog(
              BuildContext context,
            ) async {
              final nameController = TextEditingController();
              final balanceController = TextEditingController();

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  String? error;

                  return StatefulBuilder(
                    builder: (context, setState) {
                      return AlertDialog(
                        title: const Text('Add Account'),
                        content: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            TextField(
                              controller: nameController,
                              decoration: const InputDecoration(
                                labelText: 'Account name',
                                hintText: 'e.g. Cash, bKash, Bank',
                              ),
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: balanceController,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Opening balance (taka)',
                                hintText: 'e.g. 5000',
                              ),
                            ),
                            if (error != null)
                              Padding(
                                padding: const EdgeInsets.only(top: 8),
                                child: Text(
                                  error!,
                                  style: const TextStyle(color: Colors.red),
                                ),
                              ),
                          ],
                        ),
                        actions: [
                          TextButton(
                            onPressed: () =>
                                Navigator.pop(dialogContext),
                            child: const Text('Cancel'),
                          ),
                          FilledButton(
                            onPressed: () async {
                              final name = nameController.text.trim();
                              final taka = int.tryParse(
                                balanceController.text.trim(),
                              );

                              if (name.isEmpty) {
                                setState(() => error =
                                    'Please enter an account name.');
                                return;
                              }

                              if (taka == null || taka < 0) {
                                setState(() => error =
                                    'Enter a valid whole-taka balance.');
                                return;
                              }

                              await database.addAccount(
                                name: name,
                                openingBalancePaisa: taka * 100,
                              );

                              if (dialogContext.mounted) {
                                Navigator.pop(dialogContext);
                              }
                            },
                            child: const Text('Save'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );

              nameController.dispose();
              balanceController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('MyMoney'),
                  centerTitle: true,
                ),
                body: StreamBuilder<List<Account>>(
                  stream: database.watchAccounts(),
                  builder: (context, snapshot) {
                    if (snapshot.hasError) {
                      return Center(
                        child: Text('Database error: ${snapshot.error}'),
                      );
                    }

                    if (!snapshot.hasData) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    final accounts = snapshot.data!;

                    if (accounts.isEmpty) {
                      return const Center(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Icon(Icons.account_balance_wallet_outlined,
                                size: 64),
                            SizedBox(height: 16),
                            Text('No accounts yet'),
                            Text('Tap + to add your first account.'),
                          ],
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: accounts.length,
                      itemBuilder: (context, index) {
                        final account = accounts[index];

                        return Card(
                          child: ListTile(
                            leading: const CircleAvatar(
                              child: Icon(Icons.account_balance_wallet),
                            ),
                            title: Text(account.name),
                            subtitle: const Text('Opening balance'),
                            trailing: Text(
                              formatMoney(account.openingBalancePaisa),
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                        );
                      },
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: () => showAddAccountDialog(context),
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
          EOF

      - name: Generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if ! git diff --cached --quiet; then
            git commit -m "Add MyMoney accounts screen"
            git push
          fi
