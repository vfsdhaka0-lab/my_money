
name: Generate MyMoney Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore mymoney-release.jks \
            -alias mymoney \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=MyMoney, OU=App, O=MyMoney, L=Dhaka, ST=Dhaka, C=BD"

      - name: Display SHA-1 fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore mymoney-release.jks \
            -alias mymoney \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1:"

      - name: Upload permanent signing key
        uses: actions/upload-artifact@v4
        with:
          name: mymoney-signing-key
          path: mymoney-release.jks
          retention-days: 1
