
name: Generate MyMoney Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore mymoney-release.jks \
            -alias mymoney \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'TemporaryPass123!' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'TemporaryPass123!' }}" \
            -dname "CN=MyMoney, OU=App, O=MyMoney, L=Dhaka, ST=Dhaka, C=BD"

      - name: Get SHA-1 fingerprint
        run: |
          keytool -list -v \
            -keystore mymoney-release.jks \
            -alias mymoney \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'TemporaryPass123!' }}" \
            | grep SHA1

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: mymoney-signing-key
          path: mymoney-release.jks
          retention-days: 1
